# SonarQube — Tonkla WordPress
sonar.projectKey=tonkla
sonar.projectName=Tonkla
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Product code only — local Sonar tooling is NOT analyzed
sonar.sources=wp-content/themes/tonkla

sonar.exclusions=\
**/node_modules/**,\
**/vendor/**,\
**/assets/css/main.css,\
**/*.min.js,\
**/*.min.css,\
**/package-lock.json,\
**/inc/import-demo.php,\
**/sonarqube/**,\
**/*.bat,\
**/*.ps1,\
**/sonar-reports/**,\
**/sonar-project.properties

sonar.cpd.exclusions=\
**/inc/import-demo.php,\
**/inc/carbon-fields.php,\
**/parts/toc/**

# No PHPUnit suite yet — do not fail Quality Gate on coverage for theme code
sonar.coverage.exclusions=**/*

# PHP analyzer
sonar.php.file.suffixes=php

# Ignore WordPress naming conventions + known false positives
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
# WP uses snake_case functions
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
# WP uses Class_With_Underscores
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
# title-tag is injected via wp_head()
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=**/header.php
# Trailing whitespace noise
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1131
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
# Missing final newline noise
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S113
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
# WP uses snake_case properties ($current_parent_id)
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S116
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
